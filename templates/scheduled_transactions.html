{% extends "layout.html" %}

{% block body %}
  <h1>Scheduled Transactions</h1>

  <!-- Add Scheduled Transaction Form -->
  <div class="transaction-form">
    <h2>Add Scheduled Transaction</h2>
    <form id="transactionForm">
      <label for="description">Description:</label>
      <input type="text" id="description" required>

      <label for="amount">Amount:</label>
      <input type="number" id="amount" step="0.01" required>

      <label for="transaction_type">Type:</label>
      <select id="transaction_type" required>
        <option value="Income">Income</option>
        <option value="Expense">Expense</option>
      </select>

      <label for="category">Category:</label>
      <input type="text" id="category" required>

      <label for="schedule_type">Schedule Type:</label>
      <select id="schedule_type" required>
        <option value="One-Time">One-Time</option>
        <option value="Recurring">Recurring</option>
      </select>

      <label for="start_date">Start Date:</label>
      <input type="date" id="start_date" required>

      <label for="end_date">End Date (optional):</label>
      <input type="date" id="end_date">

      <label for="interval">Interval (days, for recurring transactions):</label>
      <input type="number" id="interval" min="1">

      <button type="submit">Add Transaction</button>
    </form>
  </div>

  <!-- Transactions Table -->
  <div class="transactions">
    <h2>Scheduled Transactions</h2>
    <table id="transactionsTable">
      <thead>
        <tr>
          <th>Description</th>
          <th>Amount</th>
          <th>Type</th>
          <th>Category</th>
          <th>Schedule</th>
          <th>Start Date</th>
          <th>End Date</th>
          <th>Interval (days)</th>
        </tr>
      </thead>
      <tbody>
        <!-- Transactions will be populated here -->
      </tbody>
    </table>
  </div>

{% endblock %}
