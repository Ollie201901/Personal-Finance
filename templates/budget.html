{% extends "layout.html" %}

{% block body %}
  <h1>Expense Budget</h1>

  <!-- Add Entry Form -->
  <div class="entry-form">
    <h2>Add Entry</h2>
    <form id="entryForm">
      <label for="entry-description">Description:</label>
      <input type="text" id="entry-description" required>

<!--      <label for="entry-date">Date:</label>-->
<!--      <input type="date" id="entry-date" required>-->

      <label for="entry-category">Category:</label>
      <select id="entry-category" required>
        {% for category in categories %}
        <option id = "{{ category['id'] }}" value="{{ category['name'] }}">{{ category['name'] }}</option>
        {% endfor %}
      </select>


      <label for="entry-amount">Amount:</label>
      <input type="number" id="entry-amount" step="0.01" required>

      <button type="submit">Add Budget Item</button>
    </form>
  </div>

  <!-- Current Balance -->
<!--  <div class="balance">-->
<!--    <h2>Current Balance: $<span id="currentBalance">0.00</span></h2>-->
<!--  </div>-->

  <!-- Entries Table -->
  <div class="entries">
    <h2>Current Budget Items</h2>
    <table id="entriesTable">
      <thead>
        <tr>
          <th>Description</th>
          <th>Category</th>
          <th>Amount</th>
          <th>Frequency</th>
        </tr>
      </thead>
      <tbody>
        <!-- Entries will be populated here -->
      </tbody>
    </table>
  </div>

{% endblock %}
